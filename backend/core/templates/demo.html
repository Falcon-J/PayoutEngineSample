<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payout System Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1a1a1a;
      --muted: #5b5b55;
      --accent: #0f766e;
      --accent-ink: #ecfffb;
      --warn: #b45309;
      --ok: #166534;
      --bad: #b91c1c;
      --ring: #d6d0c4;
      --shadow: 0 20px 40px rgba(26, 26, 26, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at 8% 8%, #d6f5ef 0, transparent 30%),
        radial-gradient(circle at 92% 14%, #f7deb9 0, transparent 34%),
        linear-gradient(145deg, #f8f5ee, #ece7dc);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      animation: rise 320ms ease-out;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--ring);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .title {
      font-size: 28px;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input {
      width: 100%;
      border: 1px solid var(--ring);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: white;
    }

    input:focus {
      outline: 2px solid #8ddad0;
      outline-offset: 1px;
      border-color: #7bcac0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font: 600 14px "Space Grotesk", sans-serif;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
    }

    .balance {
      font-size: 30px;
      margin-top: 4px;
      line-height: 1.1;
    }

    .message {
      min-height: 22px;
      font-size: 14px;
      font-weight: 500;
    }

    .message.ok {
      color: var(--ok);
    }

    .message.warn {
      color: var(--warn);
    }

    .message.bad {
      color: var(--bad);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--ring);
      background: #fff;
    }

    th,
    td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #ece7db;
      font-size: 14px;
    }

    th {
      background: #faf6ee;
      color: #3c3a36;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pending {
      background: #f3f4f6;
      color: #374151;
    }

    .processing {
      background: #fff7ed;
      color: #9a3412;
    }

    .completed {
      background: #ecfdf3;
      color: #166534;
    }

    .failed {
      background: #fef2f2;
      color: #991b1b;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 780px) {
      .grid {
        grid-template-columns: 1fr;
      }

      th,
      td {
        font-size: 12px;
        padding: 8px;
      }

      .balance {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1 class="title">Payout Demo Layer</h1>
      <div class="subtitle">Live proof for balance math, idempotency, async status changes, and refund behavior.</div>
    </section>

    <section class="card grid">
      <div>
        <label for="merchant">Merchant Id</label>
        <input id="merchant" class="mono" value="1" placeholder="1">
      </div>
      <div>
        <label>Computed Balance (paise)</label>
        <div id="balance" class="balance mono">-</div>
      </div>
      <div>
        <label>Last Refresh</label>
        <div id="last-refresh" class="mono" style="margin-top: 10px; color: var(--muted);">never</div>
      </div>
    </section>

    <section class="card">
      <h3 style="margin-top: 0; margin-bottom: 12px;">Create Payout</h3>
      <div class="row">
        <div class="field" style="min-width: 200px; flex: 1;">
          <label for="amount">Amount (paise)</label>
          <input id="amount" class="mono" placeholder="5000">
        </div>
        <div class="field" style="min-width: 320px; flex: 2;">
          <label for="bank">Bank Account Id</label>
          <input id="bank" class="mono" placeholder="bank_demo_001">
        </div>
        <div class="field" style="min-width: 320px; flex: 2;">
          <label for="key">Idempotency Key</label>
          <input id="key" class="mono" placeholder="demo-key-001">
        </div>
        <div class="field" style="min-width: 140px;">
          <button id="submit" type="button">Submit</button>
        </div>
      </div>
      <div id="message" class="message" aria-live="polite"></div>
    </section>

    <section class="card">
      <h3 style="margin-top: 0; margin-bottom: 12px;">Payouts</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Attempts</th>
            <th>Idempotency Key</th>
            <th>Created</th>
            <th>Updated</th>
          </tr>
        </thead>
        <tbody id="payouts-body"></tbody>
      </table>
    </section>
  </main>

  <script>
    const merchantInput = document.getElementById("merchant");
    const amountInput = document.getElementById("amount");
    const keyInput = document.getElementById("key");
    const bankInput = document.getElementById("bank");
    const messageEl = document.getElementById("message");
    const balanceEl = document.getElementById("balance");
    const refreshEl = document.getElementById("last-refresh");
    const tableBody = document.getElementById("payouts-body");
    const submitBtn = document.getElementById("submit");

    function merchantHeaders() {
      return { "X-Merchant-Id": merchantInput.value.trim() };
    }

    function setMessage(text, kind) {
      messageEl.className = "message" + (kind ? " " + kind : "");
      messageEl.textContent = text || "";
    }

    function statusPill(status) {
      const s = String(status || "").toLowerCase();
      return `<span class="pill ${s}">${s || "unknown"}</span>`;
    }

    function fmtTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? iso : d.toLocaleString();
    }

    async function fetchBalance() {
      const r = await fetch("/api/balance", { headers: merchantHeaders() });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Balance fetch failed");
      balanceEl.textContent = String(data.available_balance_paise);
    }

    async function fetchPayouts() {
      const r = await fetch("/api/payouts", { headers: merchantHeaders() });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Payout fetch failed");

      tableBody.innerHTML = data.map((p) => `
        <tr>
          <td class="mono">${p.id}</td>
          <td class="mono">${p.amount_paise}</td>
          <td>${statusPill(p.status)}</td>
          <td class="mono">${p.attempts}</td>
          <td class="mono">${p.idempotency_key}</td>
          <td class="mono">${fmtTime(p.created_at)}</td>
          <td class="mono">${fmtTime(p.updated_at)}</td>
        </tr>
      `).join("");
    }

    async function refreshAll() {
      try {
        await Promise.all([fetchBalance(), fetchPayouts()]);
        refreshEl.textContent = new Date().toLocaleTimeString();
      } catch (err) {
        setMessage(err.message || "Refresh failed", "bad");
      }
    }

    async function createPayout() {
      const amount = amountInput.value.trim();
      const key = keyInput.value.trim();
      const bank = bankInput.value.trim();
      if (!amount || !key || !bank) {
        setMessage("Amount, bank account id, and idempotency key are required.", "warn");
        return;
      }

      submitBtn.disabled = true;
      setMessage("Submitting payout...", "warn");

      try {
        const r = await fetch("/api/payouts", {
          method: "POST",
          headers: {
            ...merchantHeaders(),
            "Content-Type": "application/json",
            "Idempotency-Key": key,
          },
          body: JSON.stringify({ amount_paise: Number(amount), bank_account_id: bank }),
        });

        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Payout creation failed");

        if (r.status === 201) {
          setMessage("Payout created (new request).", "ok");
        } else {
          setMessage("Idempotency replay: existing payout returned.", "warn");
        }

        await refreshAll();
      } catch (err) {
        setMessage(err.message || "Payout creation failed", "bad");
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener("click", createPayout);
    merchantInput.addEventListener("change", refreshAll);
    merchantInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") refreshAll();
    });

    setInterval(refreshAll, 3000);
    refreshAll();
  </script>
</body>
</html>
